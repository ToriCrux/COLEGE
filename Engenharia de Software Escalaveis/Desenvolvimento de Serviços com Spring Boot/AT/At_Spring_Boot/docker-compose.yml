version: "3.8"

services:
  mongo:
    image: mongo:6
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  api:
    build: .
    container_name: at-spring-boot-api
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/academico_db
      SPRING_PROFILES_ACTIVE: default
    restart: unless-stopped

volumes:
  mongo_data:
